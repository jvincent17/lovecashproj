<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf6f9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Duit Kara" />
    <title>Duit Kara</title>
    <script>
      // Terapkan tema sebelum halaman tampil supaya tidak berkedip
      try {
        var t = JSON.parse(localStorage.getItem('duitkara-theme') || '{}')
        document.documentElement.dataset.palette = t.palette === 'blue' ? 'blue' : 'pink'
        document.documentElement.dataset.mode = t.mode === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.palette = 'pink'
        document.documentElement.dataset.mode = 'light'
      }
    </script>
    <style>
      /* Splash screen: tampil instan sebelum JS dimuat */
      #splash { --g1: #f9a8d4; --g2: #c026a5; --sb: #fdf6f9; --sa: #c026a5; --sa2: #f472b6; --sm: #94808e; --si: #2b1d28;
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: var(--sb); transition: opacity .35s ease, transform .35s ease; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      [data-mode="dark"] #splash { --sb: #171015; --sa: #f5a3e3; --sa2: #f9a8d4; --sm: #b49cad; --si: #f7e9f2; }
      [data-palette="blue"] #splash { --g1: #8fb6f7; --g2: #4470d4; --sb: #f5f8fd; --sa: #4470d4; --sa2: #8fb6f7; --sm: #7f8aa0; --si: #1e2536; }
      [data-palette="blue"][data-mode="dark"] #splash { --g1: #8fb6f7; --g2: #4470d4; --sb: #10141c; --sa: #9dc1ff; --sa2: #c4d7ff; --sm: #9aa6bc; --si: #e8eef9; }
      #splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .logo { position: relative; width: 96px; height: 96px; border-radius: 28px;
        background: linear-gradient(135deg, var(--g1), var(--g2)); display: grid; place-items: center;
        box-shadow: 0 18px 40px -12px color-mix(in srgb, var(--g2) 55%, transparent);
        animation: sp-pop .7s cubic-bezier(.34,1.56,.64,1) both; }
      #splash .logo::before, #splash .logo::after { content: ''; position: absolute; inset: 0; border-radius: 28px;
        border: 2px solid var(--sa2); opacity: 0; animation: sp-ring 1.8s ease-out .6s infinite; }
      #splash .logo::after { animation-delay: 1.5s; }
      #splash svg { width: 92px; height: 92px; animation: sp-beat 1.2s ease-in-out .7s infinite; }
      #splash .name { font-size: 22px; font-weight: 700; color: var(--si); letter-spacing: -.01em; animation: sp-up .6s ease .25s both; }
      #splash .tag { font-size: 12px; color: var(--sm); margin-top: -12px; animation: sp-up .6s ease .4s both; }
      #splash .dots { display: flex; gap: 6px; margin-top: 6px; animation: sp-up .6s ease .55s both; }
      #splash .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--sa); animation: sp-dot 1s ease-in-out infinite; }
      #splash .dots i:nth-child(2) { animation-delay: .15s; } #splash .dots i:nth-child(3) { animation-delay: .3s; }
      @keyframes sp-pop { from { transform: scale(.4) rotate(-12deg); opacity: 0 } to { transform: none; opacity: 1 } }
      @keyframes sp-ring { from { transform: scale(1); opacity: .6 } to { transform: scale(1.7); opacity: 0 } }
      @keyframes sp-beat { 0%, 100% { transform: scale(1) } 15% { transform: scale(1.14) } 30% { transform: scale(.98) } 45% { transform: scale(1.08) } }
      @keyframes sp-up { from { transform: translateY(10px); opacity: 0 } to { transform: none; opacity: 1 } }
      @keyframes sp-dot { 0%, 100% { transform: translateY(0); opacity: .35 } 50% { transform: translateY(-5px); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash *::before, #splash *::after { animation: none !important } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="logo">
        <svg viewBox="0 0 512 512"><path d="M256 396s-124-72-124-164c0-46 35-78 76-78 27 0 41 12 48 23 7-11 21-23 48-23 41 0 76 32 76 78 0 92-124 164-124 164z" fill="#fff"/><text x="256" y="292" font-family="Arial, sans-serif" font-size="92" font-weight="700" text-anchor="middle" style="fill:var(--g2)">Rp</text></svg>
      </div>
      <div class="name">Duit Kara</div>
      <div class="tag">atur uang berdua, tenang setiap hari</div>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
    <script>
      // Disembunyikan oleh aplikasi saat siap (minimal 0,7 detik supaya animasi terlihat, maksimal 8 detik)
      (function () {
        var t0 = Date.now(), done = false
        window.__hideSplash = function () {
          if (done) return; done = true
          setTimeout(function () {
            var el = document.getElementById('splash'); if (!el) return
            el.classList.add('hide'); setTimeout(function () { el.remove() }, 400)
          }, Math.max(0, 700 - (Date.now() - t0)))
        }
        setTimeout(window.__hideSplash, 8000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
