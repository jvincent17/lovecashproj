<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf6f9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Duit Kara</title>
    <script>
      // Terapkan tema sebelum halaman tampil supaya tidak berkedip
      try {
        var t = JSON.parse(localStorage.getItem('duitkara-theme') || '{}')
        document.documentElement.dataset.palette = t.palette === 'blue' ? 'blue' : 'pink'
        document.documentElement.dataset.mode = t.mode === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.palette = 'pink'
        document.documentElement.dataset.mode = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
