<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf6f9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Duit Kara" />
    <title>Duit Kara</title>
    <script>
      // Terapkan tema sebelum halaman tampil supaya tidak berkedip
      try {
        var t = JSON.parse(localStorage.getItem('duitkara-theme') || '{}')
        document.documentElement.dataset.palette = t.palette === 'blue' ? 'blue' : 'pink'
        document.documentElement.dataset.mode = t.mode === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.palette = 'pink'
        document.documentElement.dataset.mode = 'light'
      }
    </script>
    <style>
      /* Splash screen: tampil instan sebelum JS dimuat. Total ±1,5 detik (animasi 1,2 dtk + memudar 0,3 dtk). */
      #splash { --g1: #f9a8d4; --g2: #c026a5; --sb: #fdf6f9; --sm: #94808e; --si: #2b1d28;
        --ease: cubic-bezier(.22,1,.36,1);
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--sb); transition: opacity .3s ease, transform .3s ease; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      [data-mode="dark"] #splash { --sb: #171015; --sm: #b49cad; --si: #f7e9f2; }
      [data-palette="blue"] #splash { --g1: #8fb6f7; --g2: #4470d4; --sb: #f5f8fd; --sm: #7f8aa0; --si: #1e2536; }
      [data-palette="blue"][data-mode="dark"] #splash { --sb: #10141c; --sm: #9aa6bc; --si: #e8eef9; }
      #splash.hide { opacity: 0; transform: scale(1.03); pointer-events: none; }
      #splash .logo { position: relative; overflow: hidden; width: 104px; height: 104px; border-radius: 30px;
        background: linear-gradient(135deg, var(--g1), var(--g2)); display: grid; place-items: center;
        box-shadow: 0 20px 44px -14px color-mix(in srgb, var(--g2) 60%, transparent);
        animation: sp-in .55s var(--ease) both; }
      #splash .logo::after { content: ''; position: absolute; inset: -20%; transform: translateX(-120%) skewX(-18deg);
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: sp-sheen .5s ease-in-out .7s both; }
      #splash svg { width: 98px; height: 98px; overflow: visible; }
      #splash svg * { transform-box: fill-box; transform-origin: center; }
      #splash .c1 { animation: sp-left .45s var(--ease) .15s both; }
      #splash .c2 { animation: sp-right .45s var(--ease) .25s both; }
      #splash .arc { stroke-dasharray: 284; stroke-dashoffset: 284; animation: sp-draw .5s var(--ease) .45s forwards; }
      #splash .eye { animation: sp-pop .25s var(--ease) .8s both, sp-blink .16s ease-in-out 1.02s; }
      #splash .bit { animation: sp-pop .3s cubic-bezier(.34,1.7,.5,1) .85s both; }
      #splash .name { margin-top: 22px; font-size: 22px; font-weight: 700; color: var(--si); animation: sp-text .45s var(--ease) .45s both; }
      #splash .tag { margin-top: 4px; font-size: 12px; color: var(--sm); animation: sp-up .4s var(--ease) .6s both; }
      #splash .bar { margin-top: 22px; width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
        background: color-mix(in srgb, var(--g2) 15%, transparent); animation: sp-up .3s ease .1s both; }
      #splash .bar i { display: block; height: 100%; width: 100%; border-radius: inherit; transform-origin: left;
        background: linear-gradient(90deg, var(--g1), var(--g2)); animation: sp-fill 1.15s cubic-bezier(.65,0,.35,1) .05s both; }
      @keyframes sp-in { from { opacity: 0; transform: scale(.82); filter: blur(10px) } to { opacity: 1; transform: none; filter: none } }
      @keyframes sp-sheen { to { transform: translateX(120%) skewX(-18deg) } }
      @keyframes sp-left { from { opacity: 0; transform: translateX(-36px) } }
      @keyframes sp-right { from { opacity: 0; transform: translateX(36px) scale(.9) } }
      @keyframes sp-draw { to { stroke-dashoffset: 0 } }
      @keyframes sp-pop { from { opacity: 0; transform: scale(0) } }
      @keyframes sp-blink { 50% { transform: scaleY(.15) } }
      @keyframes sp-text { from { opacity: 0; letter-spacing: .18em; filter: blur(4px) } to { opacity: 1; letter-spacing: -.01em; filter: none } }
      @keyframes sp-up { from { opacity: 0; transform: translateY(8px) } }
      @keyframes sp-fill { from { transform: scaleX(0) } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash *::before, #splash *::after { animation: none !important; stroke-dashoffset: 0 !important } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="logo">
        <svg viewBox="66 76 380 310"><circle class="c1" cx="198" cy="240" r="100" fill="#fff" fill-opacity=".55"/><g class="c2"><circle cx="292" cy="214" r="100" fill="#fff"/><path class="arc" d="M336.4 176.7 A58 58 0 1 0 336.4 251.3" fill="none" style="stroke:var(--g2)" stroke-width="30" stroke-linecap="round"/><circle class="bit" cx="338" cy="214" r="14" style="fill:var(--g1)"/><circle class="eye" cx="280" cy="192" r="9" style="fill:var(--g2)"/></g></svg>
      </div>
      <div class="name">Duit Kara</div>
      <div class="tag">atur uang berdua, tenang setiap hari</div>
      <div class="bar"><i></i></div>
    </div>
    <script>
      // Disembunyikan oleh aplikasi saat siap (animasi selesai ±1,2 detik lalu memudar 0,3 detik, maksimal 8 detik)
      (function () {
        var t0 = Date.now(), done = false
        window.__hideSplash = function () {
          if (done) return; done = true
          setTimeout(function () {
            var el = document.getElementById('splash'); if (!el) return
            el.classList.add('hide'); setTimeout(function () { el.remove() }, 320)
          }, Math.max(0, 1200 - (Date.now() - t0)))
        }
        setTimeout(window.__hideSplash, 8000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
